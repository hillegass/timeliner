[package]
name = "timeliner"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color = "0.3.3"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
json5 = "1.3.7"
parley = "0.12.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
vello_cpu = "0.3.0"

# The layout search is slow unoptimized; optimize test builds.
[profile.test]
opt-level = 2

[dev-dependencies]
png = "0.18"
